<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hyrox Open · Vinicius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0908;--bg-1:#131210;--bg-2:#1B1A17;--bg-3:#25231F;
  --border:#2E2B27;--border-s:#43403A;
  --text:#FAFAF7;--text-2:#B5B0A8;--text-3:#6E6A62;
  --paper:#E8E0D3;--paper-dim:#C9C2B5;
  --accent:#E63946;--accent-soft:#E6394612;--accent-deep:#B82A36;
  --ok:#87A878;--part:#D97757;--warn:#D4A24C;--info:#7C9CBF;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:14px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(230,57,70,.05) 0%,transparent 50%),radial-gradient(ellipse at bottom,rgba(124,156,191,.03) 0%,transparent 50%);pointer-events:none;z-index:0}

/* HEADER */
.hdr{position:sticky;top:0;z-index:50;background:rgba(10,9,8,.9);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid var(–border);padding:20px 22px 16px}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hdr-left h1{font-family:var(–serif);font-size:32px;font-weight:400;line-height:.92;letter-spacing:-.025em}
.hdr-left h1 em{font-style:italic;color:var(–accent)}
.hdr-left .sub{font-size:10px;color:var(–text-3);text-transform:uppercase;letter-spacing:.22em;margin-top:8px;font-weight:600}
.phase-pill{display:inline-block;padding:3px 10px;background:var(–accent-soft);color:var(–accent);border:.5px solid var(–accent);border-radius:100px;font-size:10px;text-transform:uppercase;letter-spacing:.15em;font-weight:700;margin-top:10px}
.countdown{text-align:right;font-family:var(–mono);flex-shrink:0}
.countdown .num{font-size:30px;font-weight:700;line-height:.9;font-feature-settings:“tnum”;letter-spacing:-.02em}
.countdown .lbl{font-size:9px;color:var(–text-3);text-transform:uppercase;letter-spacing:.18em;margin-top:5px;font-weight:600}
.overall-bar{height:2px;background:var(–bg-2);margin-top:14px;overflow:hidden}
.overall-bar-fill{height:100%;background:linear-gradient(90deg,var(–accent),var(–accent-deep));transition:width .6s cubic-bezier(.4,0,.2,1)}
.overall-bar-meta{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;font-family:var(–mono);color:var(–text-3);font-feature-settings:“tnum”;letter-spacing:.05em}

/* MAIN */
.main{padding:26px 16px 100px;max-width:720px;margin:0 auto;position:relative;z-index:1}
.section-label{font-family:var(–serif);font-style:italic;font-size:14px;color:var(–text-3);font-weight:400;margin:28px 4px 14px;display:flex;align-items:center;gap:12px}
.section-label::after{content:’’;flex:1;height:1px;background:var(–border)}
.section-label:first-child{margin-top:0}

/* WEEK CARD */
.week-card{background:var(–bg-1);border:1px solid var(–border);border-radius:var(–r);margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.week-card.has-data{border-color:var(–border-s)}
.week-card.complete{border-color:var(–accent)}
.week-head{padding:18px 20px;display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none}
.week-num{font-family:var(–serif);font-style:italic;font-size:44px;line-height:.85;color:var(–text-3);min-width:44px;font-weight:400}
.week-card.has-data .week-num{color:var(–paper-dim)}
.week-card.complete .week-num{color:var(–accent)}
.week-card.current .week-num{color:var(–text)}
.week-info{flex:1;min-width:0}
.week-title{font-size:16px;font-weight:500;line-height:1.2;letter-spacing:-.01em}
.week-meta{font-size:11px;color:var(–text-3);margin-top:4px;font-family:var(–mono);font-feature-settings:“tnum”;letter-spacing:.02em}
.week-progress{display:flex;gap:3px;align-items:center}
.week-dot{width:7px;height:7px;border-radius:50%;background:var(–bg-3);transition:background .2s}
.week-dot.done{background:var(–ok)}
.week-dot.partial{background:var(–part)}
.week-dot.skipped{background:var(–text-3);opacity:.5}
.week-dot.off{background:transparent;border:1px dashed var(–border-s)}
.chevron{width:20px;height:20px;color:var(–text-3);transition:transform .3s;flex-shrink:0}
.week-card.open .chevron{transform:rotate(90deg)}
.week-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.week-card.open .week-body{max-height:3000px}
.day-list{padding:0 8px 12px}
.day-item{display:flex;align-items:center;padding:14px 12px;margin:2px 0;border-radius:var(–rs);cursor:pointer;transition:background .15s;gap:12px}
.day-item:hover{background:var(–bg-2)}
.day-item:active{background:var(–bg-3)}
.day-status{width:32px;height:32px;border-radius:50%;background:var(–bg-2);border:1.5px solid var(–border-s);display:flex;align-items:center;justify-content:center;font-family:var(–mono);font-size:11px;font-weight:700;color:var(–text-3);flex-shrink:0;transition:all .2s}
.day-item.done .day-status{background:var(–ok);border-color:var(–ok);color:var(–bg)}
.day-item.partial .day-status{background:var(–part);border-color:var(–part);color:var(–bg)}
.day-item.skipped .day-status{background:transparent;border-color:var(–text-3);border-style:dashed;color:var(–text-3)}
.day-item.off .day-status{background:transparent;border-color:var(–border);color:var(–text-3)}
.day-info{flex:1;min-width:0}
.day-name{font-size:14px;font-weight:500;line-height:1.3}
.day-type{font-size:10px;color:var(–text-3);margin-top:3px;font-family:var(–mono);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.day-type.tt-forca{color:var(–warn)}
.day-type.tt-corrida{color:var(–info)}
.day-type.tt-hyrox{color:var(–accent)}
.day-arrow{color:var(–text-3);font-size:16px;flex-shrink:0}
.week-footer{padding:6px 12px 16px;border-top:1px dashed var(–border);margin-top:6px}
.btn-summary{width:100%;background:transparent;border:1px solid var(–border-s);color:var(–text);padding:12px;border-radius:var(–rs);font-family:var(–sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-summary:hover{background:var(–bg-2);border-color:var(–accent)}
.btn-summary svg{width:14px;height:14px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:none;opacity:0;transition:opacity .25s;overflow-y:auto}
.modal-bg.open{display:flex;opacity:1}
.modal-bg.flex-end{align-items:flex-end}
.modal{background:var(–bg-1);border-radius:var(–r) var(–r) 0 0;border-top:1px solid var(–border-s);width:100%;max-width:640px;margin:0 auto;max-height:96vh;display:flex;flex-direction:column;transform:translateY(20px);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.modal-bg.open .modal{transform:translateY(0)}
@media(min-width:768px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:var(–r);border:1px solid var(–border-s);max-height:90vh}}
.modal-grip{width:36px;height:4px;background:var(–border-s);border-radius:4px;margin:10px auto 0;flex-shrink:0}
.modal-head{padding:16px 20px 18px;border-bottom:1px solid var(–border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.modal-title-wrap{flex:1;min-width:0}
.modal-title{font-family:var(–serif);font-size:22px;font-weight:400;line-height:1.1;letter-spacing:-.015em}
.modal-subtitle{font-size:11px;color:var(–text-3);margin-top:6px;font-family:var(–mono);letter-spacing:.05em;text-transform:uppercase}
.modal-actions{display:flex;gap:6px;flex-shrink:0}
.modal-icon-btn{background:var(–bg-2);border:1px solid var(–border);width:34px;height:34px;border-radius:50%;color:var(–text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-icon-btn:hover{background:var(–bg-3);border-color:var(–border-s)}
.modal-icon-btn svg{width:14px;height:14px}
.modal-body{padding:18px 20px 24px;overflow-y:auto;flex:1}

/* TRAINING */
.local-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:var(–bg-2);border:1px solid var(–border);border-radius:100px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(–text-2);margin-bottom:16px}
.local-tag.pista{color:var(–info);border-color:#7C9CBF40}
.local-tag.academia{color:var(–warn);border-color:#D4A24C40}
.train-section{margin-bottom:20px}
.train-section:last-child{margin-bottom:0}
.train-sub{font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:var(–accent);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.train-sub::before{content:’’;width:16px;height:1px;background:var(–accent)}
.train-list{list-style:none}
.train-list li{padding:8px 0 8px 18px;position:relative;font-size:14px;line-height:1.55;color:var(–text-2);border-bottom:1px solid var(–border)}
.train-list li:last-child{border-bottom:none}
.train-list li::before{content:’’;position:absolute;left:4px;top:17px;width:4px;height:4px;border-radius:50%;background:var(–text-3)}
.off-msg{text-align:center;padding:50px 20px;font-family:var(–serif);font-style:italic;font-size:26px;color:var(–paper-dim);letter-spacing:-.01em}

/* REGISTRO */
.reg-section{margin-top:26px;padding-top:22px;border-top:1px solid var(–border-s)}
.reg-section .train-sub{color:var(–ok)}
.reg-section .train-sub::before{background:var(–ok)}
.status-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:18px}
.status-btn{background:var(–bg-2);border:1.5px solid var(–border);color:var(–text-2);padding:12px 6px;border-radius:var(–rs);font-family:var(–sans);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.status-btn:hover{border-color:var(–border-s)}
.status-btn.active.done{background:var(–ok);border-color:var(–ok);color:var(–bg)}
.status-btn.active.partial{background:var(–part);border-color:var(–part);color:var(–bg)}
.status-btn.active.skipped{background:var(–text-3);border-color:var(–text-3);color:var(–bg)}
.status-btn .ico{font-size:16px;line-height:1;font-family:var(–mono)}
.field{margin-bottom:15px}
.field-label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(–text-3);font-weight:600;margin-bottom:8px;display:block}
.field-input,.field-textarea{width:100%;background:var(–bg-2);border:1px solid var(–border);color:var(–text);padding:11px 14px;border-radius:var(–rs);font-family:var(–sans);font-size:14px;transition:border-color .15s;-webkit-appearance:none}
.field-input:focus,.field-textarea:focus{outline:none;border-color:var(–accent)}
.field-textarea{resize:vertical;min-height:70px;font-family:var(–sans)}
.field-input.mono{font-family:var(–mono);font-feature-settings:“tnum”}
.rpe-row{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.rpe-btn{background:var(–bg-2);border:1px solid var(–border);color:var(–text-2);padding:9px 0;border-radius:6px;font-family:var(–mono);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.rpe-btn:hover{border-color:var(–border-s)}
.rpe-btn.active{background:var(–accent);border-color:var(–accent);color:white}
.rpe-meta{font-family:var(–mono);font-size:9px;color:var(–text-3);margin-top:7px;text-align:center;letter-spacing:.05em}
.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Exercícios */
.ex-headers,.ex-row{display:grid;grid-template-columns:1fr 80px 75px;gap:8px;padding:4px 10px}
.ex-headers{font-size:9px;text-transform:uppercase;color:var(–text-3);letter-spacing:.15em;font-weight:600;padding-bottom:6px}
.ex-headers>div:nth-child(2),.ex-headers>div:nth-child(3){text-align:center}
.ex-list{background:var(–bg-2);border-radius:var(–rs);padding:4px}
.ex-row{align-items:center;border-bottom:1px solid var(–bg-3)}
.ex-row:last-child{border-bottom:none}
.ex-name{font-size:13px;color:var(–text);font-weight:500;line-height:1.3}
.ex-row input{width:100%;background:var(–bg-1);border:1px solid var(–border);color:var(–text);padding:7px 8px;border-radius:6px;font-family:var(–mono);font-size:12px;text-align:center;font-feature-settings:“tnum”}
.ex-row input:focus{outline:none;border-color:var(–accent)}

/* Tiros */
.t-headers,.t-row{display:grid;grid-template-columns:32px 1fr 1fr;gap:8px;padding:4px 10px}
.t-headers{font-size:9px;text-transform:uppercase;color:var(–text-3);letter-spacing:.15em;font-weight:600;padding-bottom:6px}
.t-headers>div:nth-child(2),.t-headers>div:nth-child(3){text-align:center}
.t-list{background:var(–bg-2);border-radius:var(–rs);padding:4px}
.t-row{align-items:center;border-bottom:1px solid var(–bg-3)}
.t-row:last-child{border-bottom:none}
.t-num{font-family:var(–serif);font-style:italic;font-size:18px;color:var(–text-3);text-align:center}
.t-row input{width:100%;background:var(–bg-1);border:1px solid var(–border);color:var(–text);padding:8px 8px;border-radius:6px;font-family:var(–mono);font-size:13px;text-align:center;font-feature-settings:“tnum”;font-weight:500}
.t-row input:focus{outline:none;border-color:var(–accent)}
.t-stats{margin-top:8px;padding:10px 12px;background:var(–bg-2);border-radius:var(–rs);display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.t-stat{text-align:center}
.t-stat-val{font-size:14px;color:var(–text);font-weight:600;font-family:var(–mono);font-feature-settings:“tnum”}
.t-stat-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:var(–text-3);margin-top:2px}

/* Rounds */
.r-headers,.r-row{display:grid;grid-template-columns:32px 1fr;gap:8px;padding:4px 10px}
.r-headers{font-size:9px;text-transform:uppercase;color:var(–text-3);letter-spacing:.15em;font-weight:600;padding-bottom:6px}
.r-list{background:var(–bg-2);border-radius:var(–rs);padding:4px}
.r-row{align-items:center;border-bottom:1px solid var(–bg-3)}
.r-row:last-child{border-bottom:none}
.r-num{font-family:var(–serif);font-style:italic;font-size:18px;color:var(–text-3);text-align:center}
.r-row input{width:100%;background:var(–bg-1);border:1px solid var(–border);color:var(–text);padding:8px 10px;border-radius:6px;font-family:var(–mono);font-size:13px;text-align:center;font-feature-settings:“tnum”}
.r-row input:focus{outline:none;border-color:var(–accent)}

.btn-save{width:100%;background:var(–accent);border:none;color:white;padding:15px;border-radius:var(–rs);font-family:var(–sans);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:18px;letter-spacing:.03em;text-transform:uppercase}
.btn-save:hover{background:var(–accent-deep)}
.btn-save:active{transform:scale(.99)}
.save-note{font-size:10px;color:var(–text-3);text-align:center;margin-top:10px;font-family:var(–mono);letter-spacing:.05em}

/* SUMMARY */
.adh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(–bg-2);padding:14px;border-radius:var(–rs);margin-bottom:16px}
.adh-stat{text-align:center}
.adh-num{font-family:var(–mono);font-size:22px;font-weight:700;font-feature-settings:“tnum”}
.adh-num.ok{color:var(–ok)}
.adh-num.pt{color:var(–part)}
.adh-lbl{font-size:8px;text-transform:uppercase;letter-spacing:.18em;color:var(–text-3);margin-top:4px;font-weight:600}
.sum-content{background:var(–bg);border:1px solid var(–border);border-radius:var(–rs);padding:16px;font-family:var(–mono);font-size:11.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(–text-2);max-height:48vh;overflow-y:auto}
.sum-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn-secondary{background:var(–bg-2);border:1px solid var(–border-s);color:var(–text);padding:12px;border-radius:var(–rs);font-family:var(–sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-secondary:hover{background:var(–bg-3)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(–paper);color:var(–bg);padding:12px 24px;border-radius:100px;font-size:13px;font-weight:600;z-index:200;transition:transform .3s cubic-bezier(.4,0,.2,1);font-family:var(–sans);white-space:nowrap;letter-spacing:.02em}
.toast.show{transform:translateX(-50%) translateY(0)}

/* FOOTER */
.footer{text-align:center;padding:60px 20px 30px;color:var(–text-3);font-size:10px;font-family:var(–mono);letter-spacing:.1em}
.footer .quote{font-family:var(–serif);font-style:italic;font-size:22px;color:var(–paper-dim);margin-bottom:14px;line-height:1.35;letter-spacing:-.01em}

/* STORY MODE */
.story-mode{position:fixed;inset:0;background:var(–bg);z-index:300;display:none;flex-direction:column;overflow-y:auto}
.story-mode.open{display:flex}
.story-mode::before{content:’’;position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(230,57,70,.08) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 50% 100%,rgba(124,156,191,.05) 0%,transparent 70%);pointer-events:none}
.story-inner{max-width:480px;margin:0 auto;padding:55px 28px 44px;width:100%;position:relative;z-index:1}
.story-brand{font-family:var(–serif);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(–text-3);text-align:center}
.story-brand em{font-style:italic;color:var(–accent);letter-spacing:0;text-transform:none;font-size:13px}
.story-divider{width:28px;height:1px;background:var(–border-s);margin:18px auto 26px}
.story-week-tag{font-family:var(–mono);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(–text-3);text-align:center;margin-bottom:10px}
.story-title{font-family:var(–serif);font-size:40px;line-height:1.05;letter-spacing:-.025em;text-align:center;margin-bottom:6px;font-weight:400}
.story-title em{font-style:italic;color:var(–accent)}
.story-date{text-align:center;font-family:var(–mono);font-size:10px;color:var(–text-3);letter-spacing:.18em;text-transform:uppercase;margin-bottom:28px}
.story-target{background:var(–bg-1);border:1px solid var(–border);border-radius:var(–rs);padding:14px 16px;margin-bottom:24px;text-align:center}
.story-target-lbl{font-family:var(–mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(–text-3);margin-bottom:4px}
.story-target-val{font-family:var(–serif);font-size:20px;font-style:italic;color:var(–paper-dim)}
.story-section{margin-bottom:20px}
.story-sub{font-family:var(–serif);font-style:italic;font-size:15px;color:var(–accent);margin-bottom:8px}
.story-list{list-style:none}
.story-list li{padding:6px 0 6px 16px;position:relative;font-size:14px;line-height:1.5;color:var(–text-2)}
.story-list li::before{content:’—’;position:absolute;left:0;top:6px;color:var(–text-3);font-family:var(–mono);font-size:11px}
.story-footer{margin-top:30px;padding-top:22px;border-top:1px solid var(–border);display:flex;justify-content:space-between;align-items:center;font-family:var(–mono);font-size:9px;color:var(–text-3);letter-spacing:.18em;text-transform:uppercase}
.story-footer .countdown-mini{font-family:var(–serif);font-style:italic;font-size:15px;letter-spacing:0;text-transform:none;color:var(–paper-dim)}

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1700); }
function gk(w,d){ return `w${w}_d${d}`; }
function gd(w,d){ return state[gk(w,d)]||null; }

function tts(t){ if(!t)return null; const p=String(t).trim().split(':'); if(p.length!==2)return null; const m=parseInt(p[0]),s=parseInt(p[1]); if(isNaN(m)||isNaN(s))return null; return m*60+s; }
function stt(s){ if(s===null||isNaN(s))return '—'; const m=Math.floor(s/60),r=Math.round(s%60); return `${m}:${String(r).padStart(2,'0')}`; }
function curWeek(){ return Math.floor((new Date()-START)/86400000/7); }

function render(){ renderHdr(); renderOverall(); renderWeeks(); }

function renderHdr(){
  const days=Math.max(0,Math.ceil((PROVA-new Date())/86400000));
  document.getElementById('countdownNum').textContent=days;
  const w=curWeek(); let ph='Pré-início';
  if(w>=0&&w<6) ph=`Fase 1 · Semana ${w+1}`;
  else if(w>=6&&w<13) ph='Fase 2 · Específico';
  else if(w>=13&&w<20) ph='Fase 3 · Race pace';
  else if(w>=20) ph='Fase 4 · Taper';
  document.getElementById('phasePill').textContent=ph;
}

function renderOverall(){
  let tot=0,done=0,part=0;
  PLAN.forEach(wk=>wk.days.forEach((d,i)=>{ if(d.type==='off')return; tot++; const dd=gd(wk.n,i); if(dd?.status==='done')done++; else if(dd?.status==='partial')part++; }));
  const pct=tot?Math.round(((done+part*.5)/tot)*100):0;
  document.getElementById('overallFill').style.width=pct+'%';
  document.getElementById('adhText').textContent=`${done+part}/${tot} · ${pct}% aderência`;
}

function renderWeeks(){
  const cw=curWeek()+1;
  document.getElementById('weekList').innerHTML=PLAN.map(wk=>{
    const dots=wk.days.map((d,i)=>{
      if(d.type==='off')return '<span class="week-dot off"></span>';
      const dd=gd(wk.n,i); let c='';
      if(dd?.status==='done')c='done'; else if(dd?.status==='partial')c='partial'; else if(dd?.status==='skipped')c='skipped';
      return `<span class="week-dot ${c}"></span>`;
    }).join('');
    const trainDays=wk.days.filter(d=>d.type!=='off');
    const done=wk.days.filter((d,i)=>d.type!=='off'&&gd(wk.n,i)?.status==='done').length;
    const hasData=wk.days.some((d,i)=>gd(wk.n,i));
    const complete=done===trainDays.length;
    return `<article class="week-card ${hasData?'has-data':''} ${complete?'complete':''} ${wk.n===cw?'current':''}" id="week-${wk.n}">
      <header class="week-head" onclick="toggleWeek(${wk.n})">
        <div class="week-num">${String(wk.n).padStart(2,'0')}</div>
        <div class="week-info"><div class="week-title">${wk.title}</div><div class="week-meta">${wk.dates} · ${wk.volume}</div></div>
        <div class="week-progress">${dots}</div>

  }).join('');
}

function setRpe(n){ document.querySelectorAll(’.rpe-btn’).forEach(b=>b.classList.remove(‘active’)); document.querySelector(`.rpe-btn[data-rpe="${n}"]`).classList.add(‘active’); }
function setCt(c){
document.querySelectorAll(’[data-ct]’).forEach(b=>b.classList.remove(‘active’,‘done’,‘partial’,‘skipped’));
const btn=document.querySelector(`[data-ct="${c}"]`); if(!btn)return;
const cls=c===‘subiu’?‘done’:c===‘manteve’?‘partial’:‘skipped’;
btn.classList.add(‘active’,cls);
}
function updT(){
const ps=Array.from(document.querySelectorAll(’.ti-p’)).map(i=>tts(i.value)).filter(t=>t!==null);
const ts=Array.from(document.querySelectorAll(’.ti-t’)).map(i=>tts(i.value)).filter(t=>t!==null);
// prefer pace, fallback to tempo×2.5 (400m→/km)
const arr=ps.length?ps:ts.length?ts.map(t=>Math.round(t*2.5)):[];
if(!arr.length){[‘ta’,‘tb’,‘tw’].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=’—’;});return;}
const avg=arr.reduce((a,b)=>a+b,0)/arr.length;
const best=Math.min(…arr),worst=Math.max(…arr);
const ta=document.getElementById(‘ta’),tb=document.getElementById(‘tb’),tw=document.getElementById(‘tw’);
if(ta)ta.textContent=stt(avg);
if(tb)tb.textContent=stt(best);
if(tw)tw.textContent=stt(worst);
}

function saveDay(){

const cb=document.querySelector(’[data-ct].active’); if(cb?.dataset.ct)dd.ct=cb.dataset.ct;
// tiros
const tl=document.getElementById(‘tList’);
if(tl){
const ts=Array.from(tl.querySelectorAll(’.ti-t’)), ps=Array.from(tl.querySelectorAll(’.ti-p’));
const tiros=ts.map((t,i)=>({tempo:t.value.trim(),pace:ps[i]?.value.trim()||’’})).filter(t=>t.tempo||t.pace);
if(tiros.length)dd.tiros=tiros;
}
// cargas
const el=document.getElementById(‘exL’);
if(el){
const c={};
el.querySelectorAll(‘input’).forEach(inp=>{
const i=inp.dataset.ei,f=inp.dataset.ef;
if(!c[i])c[i]={};
if(inp.value.trim())c[i][f]=inp.value.trim();
});
if(Object.values(c).some(x=>Object.keys(x).length))dd.cargas=c;
}
// rounds
const rl=document.getElementById(‘rList’);
if(rl){
const rounds=Array.from(rl.querySelectorAll(’.ri’)).map(i=>i.value.trim());
if(rounds.some(r=>r))dd.rounds=rounds;
}
[‘pace’,‘dist’,‘tempo’,‘dor’,‘obs’,‘sono’,‘hor’,‘mot’].forEach(f=>{
const el=document.getElementById(‘f_’+f); if(el&&el.value.trim())dd[f]=el.value.trim();
});
state[k]=dd; save(); closeDayModal(); render();
}

function openSum(wn){
const wk=PLAN.find(w=>w.n===wn);
const tr=wk.days.filter(d=>d.type!==‘off’);
let done=0,part=0,skip=0,nt=0,rs=0,rc=0;
wk.days.forEach((d,i)=>{ if(d.type===‘off’)return; const dd=gd(wn,i); if(!dd){nt++;return;} if(dd.status===‘done’)done++; else if(dd.status===‘partial’)part++; else if(dd.status===‘skipped’)skip++; if(dd.rpe!==undefined){rs+=dd.rpe;rc++;} });
const avgRpe=rc?(rs/rc).toFixed(1):’—’;
document.getElementById(‘sumAdh’).innerHTML=` <div class="adh-stat"><div class="adh-num ok">${done}</div><div class="adh-lbl">concluídos</div></div> <div class="adh-stat"><div class="adh-num pt">${part}</div><div class="adh-lbl">parciais</div></div> <div class="adh-stat"><div class="adh-num">${skip}</div><div class="adh-lbl">faltas</div></div> <div class="adh-stat"><div class="adh-num">${avgRpe}</div><div class="adh-lbl">RPE médio</div></div>`;
document.getElementById(‘sumSubtitle’).textContent=`Semana ${wn} · ${wk.dates}`;
document.getElementById(‘sumTitle’).textContent=`Semana ${wn} — ${wk.title}`;
let md=`# Resumo Semana ${wn} — ${wk.title}\n**Período:** ${wk.dates}\n**Volume planejado:** ${wk.volume}\n\n## Aderência\n- Concluídos: ${done}/${tr.length}\n- Parciais: ${part}\n- Faltas: ${skip}\n- Não registrados: ${nt}\n- RPE médio: ${avgRpe}\n\n## Detalhes por dia\n`;
wk.days.forEach((d,i)=>{
if(d.type===‘off’)return;
const dd=gd(wn,i);
md+=`\n### ${d.d} · ${d.name}\n`;
if(!dd){md+=`- Status: não registrado\n`;return;}
md+=`- Status: **${dd.status}**\n`;
if(dd.rpe!==undefined)md+=`- RPE: ${dd.rpe}\n`;
if(dd.sono)md+=`- Sono noite anterior: ${dd.sono}\n`;
if(dd.hor)md+=`- Horário: ${dd.hor}\n`;
if(dd.tempo)md+=`- Tempo total: ${dd.tempo} min\n`;
if(dd.tiros&&dd.tiros.length){
md+=`- Tiros:\n`;
dd.tiros.forEach((t,idx)=>{ md+=`  - Tiro ${idx+1}: ${t.tempo||'—'}${t.pace?' (pace '+t.pace+'/km)':''}\n`; });
const ps=dd.tiros.map(t=>tts(t.pace)).filter(p=>p!==null);
if(ps.length){ const avg=ps.reduce((a,b)=>a+b,0)/ps.length; md+=`  - **Pace médio: ${stt(avg)}/km · melhor ${stt(Math.min(...ps))} · pior ${stt(Math.max(...ps))}**\n`; }
}
if(dd.pace)md+=`- Pace médio: ${dd.pace}\n`;
if(dd.dist)md+=`- Distância: ${dd.dist}\n`;
if(dd.cargas&&Object.keys(dd.cargas).length){
md+=`- Cargas:\n`;
Object.entries(dd.cargas).forEach(([idx,c])=>{ const en=d.ex?.[idx]||`Ex.${parseInt(idx)+1}`; const pts=[]; if(c.kg)pts.push(c.kg+‘kg’); if(c.reps)pts.push(c.reps+’ reps’); if(pts.length)md+=`  - ${en}: ${pts.join(' × ')}\n`; });
}
if(dd.ct)md+=`- Cargas vs semana anterior: **${dd.ct}**\n`;
if(dd.rounds&&dd.rounds.some(r=>r)){ md+=`- Tempo por round:\n`; dd.rounds.forEach((r,i)=>{ if(r)md+=`  - Round ${i+1}: ${r}\n`; }); }
if(dd.dor)md+=`- Dor/sintoma: ${dd.dor}\n`;
if(dd.obs)md+=`- Obs: ${dd.obs}\n`;
if(dd.motivo)md+=`- Motivo da falta: ${dd.motivo}\n`;
if(dd.extra)md+=`- Extra: ${dd.extra}\n`;
});
md+=`\n## Como me sinto no geral\n_(adicione antes de enviar: pernas, sono, motivação, qualquer coisa importante)_\n`;
document.getElementById(‘sumContent’).textContent=md;
document.getElementById(‘sumModal’).classList.add(‘open’);
document.body.style.overflow=‘hidden’;
}

function closeSumModal(){ document.getElementById(‘sumModal’).classList.remove(‘open’); document.body.style.overflow=’’; }

function copySum(){
const txt=document.getElementById(‘sumContent’).textContent;
navigator.clipboard.writeText(txt).then(()=>toast(‘Copiado · cola no chat’)).catch(()=>{
const ta=document.createElement(‘textarea’); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand(‘copy’); document.body.removeChild(ta); toast(‘Copiado · cola no chat’);
});
}
function shareSum(){ const txt=document.getElementById(‘sumContent’).textContent; if(navigator.share)navigator.share({title:‘Resumo Hyrox’,text:txt}).catch(()=>{}); else copySum(); }

document.getElementById(‘dayModal’).addEventListener(‘click’,e=>{if(e.target.id===‘dayModal’)closeDayModal();});
document.getElementById(‘sumModal’).addEventListener(‘click’,e=>{if(e.target.id===‘sumModal’)closeSumModal();});
document.addEventListener(‘keydown’,e=>{ if(e.key===‘Escape’){ if(document.getElementById(‘storyMode’).classList.contains(‘open’))closeStory(); else{closeDayModal();closeSumModal();} } });

render();
const wi=curWeek(); setTimeout(()=>toggleWeek(wi>=0&&wi<6?wi+1:1),200);
</script>


</body>
</html>
